<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>GPT Enhancer</title>
</head>

<body>
  <main class="panel">
    <button class="help-trigger" type="button" id="help-btn" aria-label="Show help">
      ?
    </button>
    <header class="panel__header">
      <h1 class="panel__title">GPT Enhancer</h1>
      <p class="panel__subtitle">Make ChatGPT Yours</p>
    </header>
    <div class="pin-banner" id="pin-banner" role="status" aria-live="polite" hidden>
      <div class="pin-banner__body">
        <p class="pin-banner__title">Pin GPT Enhancer</p>
        <p class="pin-banner__text">Open the Extensions menu and pin GPT Enhancer for quicker access.</p>
      </div>
      <button class="pin-banner__dismiss" type="button" id="pin-banner-dismiss">Got it</button>
    </div>
    <nav class="panel-tabs" role="tablist" aria-label="Main views">
      <button class="panel-tabs__tab is-active" type="button" id="panel-tab-settings" role="tab" aria-selected="true"
        aria-controls="panel-view-settings">
        Settings
      </button>
      <button class="panel-tabs__tab" type="button" id="panel-tab-prompts" role="tab" aria-selected="false"
        aria-controls="panel-view-prompts" tabindex="-1">
        Prompts
      </button>
    </nav>
    <div class="panel-views">
      <div id="panel-view-settings" class="panel-view is-active" role="tabpanel" aria-labelledby="panel-tab-settings">

        <section class="panel__section">
          <label class="toggle">
            <input type="checkbox" id="toggle-enable" class="toggle__input" />
            <span class="toggle__track">
              <span class="toggle__thumb"></span>
            </span>
            <div class="toggle__content">
              <span class="toggle__title">Enable extension</span>
              <span class="toggle__hint">
                Turn extension on for ChatGPT conversations.
              </span>
            </div>
          </label>
        </section>

        <section class="panel__section panel__section--accordion">
          <button class="accordion__header" type="button" aria-controls="fonts-section" aria-expanded="false"
            data-target="fonts-section">
            <span class="panel__section-title">Fonts</span>
            <span class="accordion__icon" aria-hidden="true">></span>
          </button>
          <div id="fonts-section" class="accordion__content">
            <label class="toggle toggle--sub">
              <input type="checkbox" id="toggle-fonts" class="toggle__input" />
              <span class="toggle__track">
                <span class="toggle__thumb"></span>
              </span>
              <div class="toggle__content">
                <span class="toggle__title">Font control</span>
                <span class="toggle__hint">Apply curated fonts to conversation text.</span>
              </div>
            </label>
            <div class="font-control" aria-live="polite">
              <div class="font-tabs" role="tablist" aria-label="Select language">
                <button class="font-tab is-active" type="button" id="font-tab-english" data-lang="english" role="tab"
                  aria-selected="true">
                  English
                </button>
                <button class="font-tab" type="button" id="font-tab-persian" data-lang="persian" role="tab"
                  aria-selected="false">
                  Persian
                </button>
              </div>
              <div class="font-options is-active" data-lang="english" role="tabpanel"
                aria-labelledby="font-tab-english">
                <button class="font-option is-active" type="button" data-lang="english" data-value="inter"
                  aria-pressed="true">
                  <div class="font-option__details"
                    style="font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;">
                    <span class="font-option__label">Inter</span>
                    <span class="font-option__preview">Sample text</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
                <button class="font-option" type="button" data-lang="english" data-value="source-sans-3"
                  aria-pressed="false">
                  <div class="font-option__details"
                    style="font-family: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;">
                    <span class="font-option__label">Source Sans 3</span>
                    <span class="font-option__preview">Sample text</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
                <button class="font-option" type="button" data-lang="english" data-value="roboto" aria-pressed="false">
                  <div class="font-option__details"
                    style="font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;">
                    <span class="font-option__label">Roboto</span>
                    <span class="font-option__preview">Sample text</span>
                  </div>
                  <span class="font-option__meta">Apache 2.0</span>
                </button>
                <button class="font-option" type="button" data-lang="english" data-value="noto-sans"
                  aria-pressed="false">
                  <div class="font-option__details"
                    style="font-family: 'Noto Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;">
                    <span class="font-option__label">Noto Sans</span>
                    <span class="font-option__preview">Sample text</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
                <button class="font-option" type="button" data-lang="english" data-value="work-sans"
                  aria-pressed="false">
                  <div class="font-option__details"
                    style="font-family: 'Work Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;">
                    <span class="font-option__label">Work Sans</span>
                    <span class="font-option__preview">Sample text</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
              </div>
              <div class="font-options" data-lang="persian" role="tabpanel" aria-labelledby="font-tab-persian" hidden>
                <button class="font-option is-active" type="button" data-lang="persian" data-value="vazirmatn"
                  aria-pressed="true">
                  <div class="font-option__details"
                    style="font-family: 'Vazirmatn', 'Noto Sans Arabic', 'Tahoma', sans-serif;">
                    <span class="font-option__label">وزیرمتن</span>
                    <span class="font-option__preview">نمونهٔ متن زیبا</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
                <button class="font-option" type="button" data-lang="persian" data-value="noto-naskh-arabic"
                  aria-pressed="false">
                  <div class="font-option__details"
                    style="font-family: 'Noto Naskh Arabic', 'Vazirmatn', 'Tahoma', sans-serif;">
                    <span class="font-option__label">نوتو نسخ عربی</span>
                    <span class="font-option__preview">نمونهٔ متن زیبا</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
                <button class="font-option" type="button" data-lang="persian" data-value="noto-sans-arabic"
                  aria-pressed="false">
                  <div class="font-option__details"
                    style="font-family: 'Noto Sans Arabic', 'Vazirmatn', 'Tahoma', sans-serif;">
                    <span class="font-option__label">نوتو سنس عربی</span>
                    <span class="font-option__preview">نمونهٔ متن زیبا</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
                <button class="font-option" type="button" data-lang="persian" data-value="sahel" aria-pressed="false">
                  <div class="font-option__details" style="font-family: 'Sahel', 'Vazirmatn', 'Tahoma', sans-serif;">
                    <span class="font-option__label">ساحل</span>
                    <span class="font-option__preview">نمونهٔ متن زیبا</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
                <button class="font-option" type="button" data-lang="persian" data-value="shabnam" aria-pressed="false">
                  <div class="font-option__details" style="font-family: 'Shabnam', 'Vazirmatn', 'Tahoma', sans-serif;">
                    <span class="font-option__label">شبنم</span>
                    <span class="font-option__preview">نمونهٔ متن زیبا</span>
                  </div>
                  <span class="font-option__meta">OFL</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="panel__section panel__section--accordion">
          <button class="accordion__header" type="button" aria-controls="stabilize-section" aria-expanded="false"
            data-target="stabilize-section">
            <span class="panel__section-title">Stabilize</span>
            <span class="accordion__icon" aria-hidden="true">></span>
          </button>
          <div id="stabilize-section" class="accordion__content">
            <label class="toggle toggle--sub">
              <input type="checkbox" id="toggle-katex" class="toggle__input" />
              <span class="toggle__track">
                <span class="toggle__thumb"></span>
              </span>
              <div class="toggle__content">
                <span class="toggle__title">KaTeX formulas</span>
                <span class="toggle__hint">Lock math layout left-to-right.</span>
              </div>
            </label>

            <label class="toggle toggle--sub">
              <input type="checkbox" id="toggle-copy" class="toggle__input" />
              <span class="toggle__track">
                <span class="toggle__thumb"></span>
              </span>
              <div class="toggle__content">
                <span class="toggle__title">Click to copy equations</span>
                <span class="toggle__hint">Tap any KaTeX formula to grab its LaTeX.</span>
              </div>
            </label>

            <label class="toggle toggle--sub">
              <input type="checkbox" id="toggle-export-quick-action" class="toggle__input" />
              <span class="toggle__track">
                <span class="toggle__thumb"></span>
              </span>
              <div class="toggle__content">
                <span class="toggle__title">Export quick action</span>
                <span class="toggle__hint">Show a floating export button on ChatGPT.</span>
              </div>
            </label>
          </div>
        </section>

        <section class="panel__section panel__section--accordion">
          <button class="accordion__header" type="button" aria-controls="theme-section" aria-expanded="false"
            data-target="theme-section">
            <span class="panel__section-title">Theme</span>
            <span class="accordion__icon" aria-hidden="true">></span>
          </button>
          <div id="theme-section" class="accordion__content">
            <div class="theme-picker" role="radiogroup" aria-label="ChatGPT theme">
              <button class="theme-card" type="button" data-theme="original" aria-label="Original theme"
                aria-pressed="false">
                <span class="theme-card__figure">
                  <span class="theme-card__swatch theme-card__swatch--original"></span>
                </span>
                <span class="theme-card__label">Original</span>
              </button>
              <button class="theme-card" type="button" data-theme="midnight" aria-label="Midnight theme"
                aria-pressed="false">
                <span class="theme-card__figure">
                  <span class="theme-card__swatch theme-card__swatch--midnight"></span>
                </span>
                <span class="theme-card__label">Midnight</span>
              </button>
              <button class="theme-card" type="button" data-theme="aurora" aria-label="Aurora theme"
                aria-pressed="false">
                <span class="theme-card__figure">
                  <span class="theme-card__swatch theme-card__swatch--aurora"></span>
                </span>
                <span class="theme-card__label">Aurora</span>
              </button>
              <button class="theme-card" type="button" data-theme="nebula" aria-label="Nebula theme"
                aria-pressed="false">
                <span class="theme-card__figure">
                  <span class="theme-card__swatch theme-card__swatch--nebula"></span>
                </span>
                <span class="theme-card__label">Nebula</span>
              </button>
              <button class="theme-card" type="button" data-theme="paper" aria-label="Paper theme" aria-pressed="false">
                <span class="theme-card__figure">
                  <span class="theme-card__swatch theme-card__swatch--paper"></span>
                </span>
                <span class="theme-card__label">Paper</span>
              </button>
              <button class="theme-card" type="button" data-theme="skylight" aria-label="Skylight theme"
                aria-pressed="false">
                <span class="theme-card__figure">
                  <span class="theme-card__swatch theme-card__swatch--skylight"></span>
                </span>
                <span class="theme-card__label">Skylight</span>
              </button>
            </div>
          </div>
        </section>

        <section class="panel__section panel__section--accordion">
          <button class="accordion__header" type="button" aria-controls="export-section" aria-expanded="false"
            data-target="export-section">
            <span class="panel__section-title">Export</span>
            <span class="accordion__icon" aria-hidden="true">></span>
          </button>
          <div id="export-section" class="accordion__content">
            <div class="export-controls">
              <span class="export-controls__title panel__section-title">Export format</span>
              <div class="export-segment" role="radiogroup" aria-label="Select export format">
                <label class="export-segment__option">
                  <input class="export-segment__input" type="radio" name="export-format" id="export-format-pdf"
                    value="pdf" checked />
                  <span class="export-segment__label">PDF</span>
                </label>
                <label class="export-segment__option">
                  <input class="export-segment__input" type="radio" name="export-format" id="export-format-docx"
                    value="docx" />
                  <span class="export-segment__label">Word</span>
                </label>
                <label class="export-segment__option">
                  <input class="export-segment__input" type="radio" name="export-format" id="export-format-markdown"
                    value="markdown" />
                  <span class="export-segment__label">Markdown</span>
                </label>
                <label class="export-segment__option">
                  <input class="export-segment__input" type="radio" name="export-format" id="export-format-txt"
                    value="txt" />
                  <span class="export-segment__label">Text</span>
                </label>
              </div>
              <div class="export-divider" aria-hidden="true"></div>
              <div class="export-segment export-segment--compact" role="radiogroup"
                aria-label="Select export content">
                <label class="export-segment__option">
                  <input class="export-segment__input" type="radio" name="export-scope" id="export-scope-all"
                    value="all" checked />
                  <span class="export-segment__label">All messages</span>
                </label>
                <label class="export-segment__option">
                  <input class="export-segment__input" type="radio" name="export-scope"
                    id="export-scope-assistant" value="assistant" />
                  <span class="export-segment__label">Assistant only</span>
                </label>
              </div>
            </div>
            <button id="export-btn" class="export-btn" type="button">
              Export conversation
            </button>
          </div>
        </section>

        <footer class="panel__footer">
          <button id="donate-btn" class="support-chip" type="button">Support</button>
          <button id="refresh-btn" class="refresh-btn" type="button">
            Refresh ChatGPT
          </button>
        </footer>
        <p class="panel__author">
          Created by
          <span class="panel__author-link-wrap">
            <a class="panel__author-link panel__author-handle" href="https://t.me/moalimir" target="_blank"
              rel="noopener noreferrer">
              @moalimir
            </a>
            <span class="panel__author-socials" role="group" aria-label="Moalimir social links">
              <a class="panel__social-link" href="https://t.me/moalimir" target="_blank" rel="noopener noreferrer"
                aria-label="Telegram">
                <svg class="panel__social-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path
                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.287 5.906q-1.168.486-4.666 2.01-.567.225-.595.442c-.03.243.275.339.69.47l.175.055c.408.133.958.288 1.243.294q.39.01.868-.32 3.269-2.206 3.374-2.23c.05-.012.12-.026.166.016s.042.12.037.141c-.03.129-1.227 1.241-1.846 1.817-.193.18-.33.307-.358.336a8 8 0 0 1-.188.186c-.38.366-.664.64.015 1.088.327.216.589.393.85.571.284.194.568.387.936.629q.14.092.27.187c.331.236.63.448.997.414.214-.02.435-.22.547-.82.265-1.417.786-4.486.906-5.751a1.4 1.4 0 0 0-.013-.315.34.34 0 0 0-.114-.217.53.53 0 0 0-.31-.093c-.3.005-.763.166-2.984 1.09" />
                </svg>
              </a>
              <a class="panel__social-link" href="https://github.com/moalimir" target="_blank"
                rel="noopener noreferrer" aria-label="GitHub">
                <svg class="panel__social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="M12 .297c-6.63 0-12 5.372-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.26.82-.577v-2.234c-3.338.727-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.757-1.333-1.757-1.09-.744.083-.729.083-.729 1.205.084 1.84 1.238 1.84 1.238 1.07 1.834 2.807 1.304 3.492.997.108-.776.418-1.304.762-1.604-2.665-.304-5.466-1.334-5.466-5.932 0-1.31.468-2.381 1.235-3.221-.124-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.119 3.176.77.84 1.233 1.911 1.233 3.221 0 4.61-2.804 5.625-5.476 5.922.43.372.823 1.102.823 2.222v3.293c0 .32.218.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.628-5.373-12-12-12" />
                </svg>
              </a>
              <a class="panel__social-link" href="mailto:moalimirinfinity@gmail.com" aria-label="Email">
                <svg class="panel__social-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414z" />
                  <path d="M0 4.697v7.104l5.803-3.558z" />
                  <path
                    d="M6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586z" />
                  <path d="M10.197 8.243 16 11.801V4.697z" />
                </svg>
              </a>
            </span>
          </span>
        </p>
      </div>
      <div id="panel-view-prompts" class="panel-view" role="tabpanel" aria-labelledby="panel-tab-prompts" hidden>
        <section class="panel__section panel__section--prompts-intro">
          <div id="prompt-error" class="prompts-error" role="status" aria-live="polite" hidden></div>
        </section>
        <section class="panel__section panel__section--accordion">
          <button class="accordion__header" type="button" id="prompt-form-accordion-header"
            aria-controls="prompt-form-section" aria-expanded="false" data-target="prompt-form-section">
            <span class="panel__section-title">Add New Prompt</span>
            <span class="accordion__icon" aria-hidden="true">></span>
          </button>
          <div id="prompt-form-section" class="accordion__content">
            <form id="prompt-form" class="prompt-form" novalidate>
              <div class="prompt-form__field">
                <label class="prompt-form__label" for="prompt-name">Title</label>
                <input class="prompt-form__input" type="text" id="prompt-name" name="prompt-name"
                  placeholder="Optional title" autocomplete="off" />
              </div>
              <div class="prompt-form__field">
                <label class="prompt-form__label" for="prompt-text">Prompt</label>
                <textarea class="prompt-form__textarea" id="prompt-text" name="prompt-text" rows="4"
                  placeholder="Write your prompt" required></textarea>
              </div>
              <div class="prompt-form__actions">
                <button type="submit" class="prompt-form__submit">Save prompt</button>
                <button type="button" class="prompt-form__cancel" id="prompt-cancel-button" hidden>
                  Cancel edit
                </button>
              </div>
            </form>
          </div>
        </section>
        <section class="panel__section">
          <div class="prompt-list__header prompt-list__header--centered">
            <div class="prompts-count" aria-live="polite">
              <span id="prompts-count">0</span>
              <span class="prompts-count__label">prompts</span>
            </div>
            <input type="search" id="prompt-search" class="prompt-search prompt-form__input" placeholder="Search..."
              autocomplete="off" aria-label="Search saved prompts" />
          </div>
          <div class="prompt-list-container">
            <div id="prompts-empty" class="prompts-empty" hidden>
              <p class="prompts-empty__primary">You have no saved prompts yet.</p>
              <p class="prompts-empty__secondary">Create your first prompt to see it here.</p>
            </div>
            <ul id="prompt-list" class="prompt-list" aria-live="polite"></ul>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="./main.js"></script>
</body>

</html>
